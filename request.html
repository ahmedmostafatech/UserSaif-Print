<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نموذج مواصفات الإنتاج الحرفي | استوديو يوزرسيف</title>
  <meta http-equiv="refresh" content="0; url=services.html#wizard-section">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: var(--s-4);
      background: var(--paper);
    }
    .redirect-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      padding: var(--s-8) var(--s-6);
      max-width: 480px;
      box-shadow: var(--shadow-2);
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid var(--teal-100);
      border-top-color: var(--primary);
      border-radius: 50%;
      margin: 0 auto var(--s-4);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    (function () {
      var search = window.location.search || "";
      var hash = window.location.hash || "#wizard-section";
      // توجيه فوري مع الحفاظ على كافة الباراميترات واختيار الخدمة
      window.location.replace("services.html" + search + hash);
    })();
  </script>
</head>
<body>
  <div class="redirect-card">
    <div class="spinner" aria-hidden="true"></div>
    <h1 class="h3" style="margin-bottom:var(--s-2)">جارٍ فتح معالج المواصفات الحرفية...</h1>
    <p class="muted" style="margin-bottom:var(--s-4)">يتم الآن تحويلك إلى صفحة الخدمات ونموذج المواصفات الفنية بأسوان.</p>
    <a class="btn btn--primary btn--sm" href="services.html#wizard-section">
      <span>انقر هنا إذا لم يتم التحويل تلقائياً</span>
      <span class="icon-dir">←</span>
    </a>
  </div>
</body>
</html>
